[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shortcut-catcher"
description = "Find and remove shortcut features: features a model exploits on its training data that do not generalise."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Yuqi Zhao" },
    { name = "Matteo Boffa" },
    { name = "Luca Vassio" },
    { name = "Marco Mellia" },
]
maintainers = [
    { name = "Yuqi Zhao" },
]
keywords = [
    "shortcut-learning",
    "spurious-correlations",
    "explainable-ai",
    "feature-selection",
    "traffic-classification",
    "ai4cti",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dynamic = ["version"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Experimental text backend: frozen ELECTRA encoder.
text = [
    "torch>=2.2",
    "transformers>=4.40",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
shortcut-catcher = "shortcut_catcher.cli:app"

[project.urls]
Homepage = "https://github.com/AI4CTI/shortcut-catcher"
Repository = "https://github.com/AI4CTI/shortcut-catcher"
Issues = "https://github.com/AI4CTI/shortcut-catcher/issues"
Changelog = "https://github.com/AI4CTI/shortcut-catcher/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.1145/3808671"

# uv only: on Linux, take the CPU build of PyTorch, which is much smaller than the
# default CUDA build. GPU users install torch themselves (see README).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.version]
path = "src/shortcut_catcher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shortcut_catcher"]

[tool.hatch.build.targets.sdist]
include = [
    "src/shortcut_catcher",
    "tests",
    "examples",
    "tools",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Code blocks in Markdown are written for reading; keep their layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by the formatter)
]

[tool.ruff.lint.per-file-ignores]
# Typer pattern: defaults built by `typer.Option(...)`.
"src/shortcut_catcher/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/shortcut_catcher/core"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running test, deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
branch = true
source = ["shortcut_catcher"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
